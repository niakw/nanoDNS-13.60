name: PS4

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v7
        with:
          repository: ps4-payload-dev/sdk
          path: sdk

      - name: Setup SDK
        working-directory: sdk
        run: |
          sudo apt update
          sudo apt install -y clang-18 lld-18
          make DESTDIR=${{ runner.tool_cache }}/ps4-payload-sdk clean install
          echo PS4_PAYLOAD_SDK=${{ runner.tool_cache }}/ps4-payload-sdk >> $GITHUB_ENV

      - name: Checkout Payload
        uses: actions/checkout@v7

      - name: Build Payload
        run: |
          make -f Makefile.ps4 clean all

      - name: Upload Payload
        uses: actions/upload-artifact@v7
        with:
          name: Payload
          path: nanodns-ps4.elf
          if-no-files-found: error

